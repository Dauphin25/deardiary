services:
  web:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/data
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:
  media_data:
